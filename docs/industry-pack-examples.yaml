# 仅供开发评审：不自动加载、不注册工具、不含真实竞品事实。
spec_version: 0.30.0
format_version: 1
status: design_only
runtime_loader: false
semantics_document: product-design.md
# 这是字段类型描述示例，不是现有 Python 类型或完整 JSON Schema。
identity: [namespace, field_id, definition_version]
shared_contracts:
  - Source/Evidence/Claim 的来源、原日期、版本和双向追溯
  - 通用 Research QA、Report QA、范围批准、预算与失败协议
  - 核心字段使用现有定义；不同语义不可复用同一标识
packs:
  - namespace: software
    pack_version: '1.0.0-draft'
    schema_version: 1
    applicability: 已确认对象包含软件产品；按研究问题选用，不凭名称自动认定
    fields:
      - field_id: api_capability
        definition_version: 1
        meaning: 公开 API 的可用范围、授权条件与限制；公开文档不证明调用成功
        value_type: text
        nature: fact
        default_recommendation: recommended
      - field_id: deployment
        definition_version: 1
        meaning: 托管、自托管或其他部署方式及版本与地区条件
        value_type: list
        item_type: text
        nature: fact
        default_recommendation: recommended
      - field_id: release_history
        definition_version: 1
        meaning: 约定时间窗内公开发版记录；区分预告与已上线
        value_type: list
        item_type: text
        nature: fact
        default_recommendation: optional
      - field_id: integrations
        definition_version: 1
        meaning: 原生、第三方或定制集成方式及条件；数量不直接等于成熟度
        value_type: list
        item_type: text
        nature: fact
        default_recommendation: recommended
    purpose_presets:
      - purpose: 部署与集成选型
        recommended_core: [core_offering, delivery_usage, prices]
        recommended_fields: [deployment, api_capability, integrations]
        required_when: 回答用户明确要求的部署或连接问题时，将相关字段解析为本轮必选
      - purpose: 迭代与产品能力观察
        recommended_core: [core_offering, limitations]
        recommended_fields: [release_history]
        required_when: 用户要求发版节奏时，release_history 必选且明确时间窗
    tool_capabilities:
      existing_registry_tools: [web_search, web_fetch]
      planned_capabilities: [document_parser]
      rule: 仅引用可信 Registry 可用能力，规划能力缺失须显式报告
    source_hints: [官方开发者文档, 部署说明, 版本说明, 集成目录]
    analysis_rules:
      - rule_id: deployment_fit
        inputs: [deployment, api_capability, integrations]
        preconditions: 已核验证据；对齐版本、地区和用户明确的部署约束
        method: 比较部署与连接要求，区分符合、不符合、未知和有依据的不适用
        output_nature: inference
        acceptance: 每项判断引用证据与条件；未提及不判定不支持
  - namespace: consumer_goods
    pack_version: '1.0.0-draft'
    schema_version: 1
    applicability: 已确认对象包含实体消费品；按品类和问题选用
    fields:
      - field_id: channels
        definition_version: 1
        meaning: 公开销售渠道及覆盖地区，不从店铺存在推断渠道份额
        value_type: list
        item_type: text
        nature: fact
        default_recommendation: recommended
      - field_id: materials
        definition_version: 1
        meaning: 对应型号或规格的材质信息及宣称来源
        value_type: list
        item_type: text
        nature: fact
        default_recommendation: recommended
      - field_id: supply_chain
        definition_version: 1
        meaning: 已公开的生产、供应与交付信息；未公开成本和产能保留缺口
        value_type: text
        nature: fact
        default_recommendation: optional
      - field_id: review_themes
        definition_version: 1
        meaning: 按型号、渠道、时间窗及样本去重归纳公开评价；不估计总体比例
        value_type: list
        item_type: text
        nature: review
        default_recommendation: recommended
    purpose_presets:
      - purpose: 渠道与体验比较
        recommended_core: [positioning, prices, offer_variants]
        recommended_fields: [channels, review_themes]
        required_when: 用户明确要求渠道或口碑比较时，将对应字段解析为必选
      - purpose: 材质与供给风险
        recommended_core: [core_offering, delivery_usage]
        recommended_fields: [materials, supply_chain]
        required_when: 结论依赖材质或供给判断时，相关适用字段必选
    tool_capabilities:
      existing_registry_tools: [web_search, web_fetch]
      planned_capabilities: [document_parser, review_collector]
      rule: 公开商品规格、渠道和评论通过统一 Adapter；受限即按故障策略停止
    source_hints: [官方商品规格, 公开产品手册, 官方渠道清单, 公开商品评价]
    analysis_rules:
      - rule_id: channel_experience
        inputs: [channels, review_themes]
        preconditions: 已核验渠道事实及评价样本；对齐地区、型号、时期并披露样本边界
        method: 归纳渠道体验问题和可验证机会，不将样本抱怨当整体缺陷
        output_nature: inference
        acceptance: 事实与建议分开；每条建议有依据和验证动作，不虚构销量或转化率
composition:
  same_semantics: 按定义版本去重，保留来源包
  different_semantics: 保留 namespace 和字段定义，禁止仅按名称合并
  conflicting_units_or_types: 解析或澄清后才能锁定，不以后加载覆盖
  package_upgrade: 新版显式差异与影响评估，旧任务保留原版本
