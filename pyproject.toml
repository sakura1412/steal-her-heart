[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steal-her-heart"
version = "0.1.0"
description = "Semi-autonomous competitor research agent — phase 1 foundation"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11", "PyYAML>=6,<7"]

[project.scripts]
steal-her-heart = "steal_her_heart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steal_her_heart = ["templates/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
