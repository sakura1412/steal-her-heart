registry_version: 1
status: instruction_catalog
runtime_loader: false
semantics_document: analysis-methods.md
common_rules:
- 仅由研究问题触发，Research QA 后由 Planner 按实际数据选择
- 继承 RULES.md 八条证据铁律，Analysis 不直接取证或扩范围
- 涉及直接比较或排名必须通过 comparison.md；不适用不排名、未知不填零
- 输出统一带方法／范围／输入／证据版本、状态、主张引用及限制
methods:
- method_id: swot
  version: 1.0.0
  display_name: SWOT
  purpose: 梳理指定对象的优势、劣势、机会和威胁
  triggers:
  - 用户需要战略因素综合
  required_inputs:
  - subject_scope
  - evidence_records
  - internal_external_context
  optional_inputs:
  - comparison_baseline
  - business_objectives
  execution_rules:
  - 先区分对象内部因素与外部环境，再逐项说明影响机制
  - 相对优势需要比较基线，不用缺证据填四象限
  - 无我方背景只评价指定对象，不生成我方赢输策略
  output:
  - strengths_weaknesses
  - opportunities_threats
  - implications
  - limitations
  failure_handling:
  - 缺必需输入返回 blocked 和具体缺口；独立已核验部分可标 limited
  - 不适用返回 skipped；执行或计算错误不得冒充事实缺失
  completion_criteria:
  - 所选问题已回答，输入与范围匹配、步骤有记录
  - 新主张核对证据支持，计算实际复算，限制与假设可见
  validation_status: controlled_case_reviewed_not_live_validated
  validation_records:
  - date: '2026-11-05'
    kind: manual_controlled_case
    result: reviewed_with_limits
    artifact: ../validation/method-cases-2026-11-05.json
    case_id: swot
    independent: false
    live_research: false
- method_id: pestle
  version: 1.0.0
  display_name: PESTLE
  purpose: 分析宏观环境对当前问题的影响
  triggers:
  - 用户关注宏观变化或外部约束
  required_inputs:
  - market_scope
  - time_window
  - macro_evidence
  optional_inputs:
  - scenario_assumptions
  execution_rules:
  - 按实际证据检查政治、经济、社会、技术、法律和环境因素，仅深入相关因素
  - 区分已生效事件、提案与预测，记录地区和时间
  - 每项说明影响路径，不把宏观标题当影响结论
  output:
  - relevant_factors
  - impact_paths
  - uncertainties
  - limitations
  failure_handling:
  - 缺必需输入返回 blocked 和具体缺口；独立已核验部分可标 limited
  - 不适用返回 skipped；执行或计算错误不得冒充事实缺失
  completion_criteria:
  - 所选问题已回答，输入与范围匹配、步骤有记录
  - 新主张核对证据支持，计算实际复算，限制与假设可见
  validation_status: controlled_case_reviewed_not_live_validated
  validation_records:
  - date: '2026-11-05'
    kind: manual_controlled_case
    result: reviewed_with_limits
    artifact: ../validation/method-cases-2026-11-05.json
    case_id: pestle
    independent: false
    live_research: false
- method_id: five_forces
  version: 1.0.0
  display_name: 五力模型
  purpose: 分析行业竞争结构
