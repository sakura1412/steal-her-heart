  required_inputs:
  - market_boundary
  - actor_relations
  - evidence_records
  optional_inputs:
  - regional_context
  execution_rules:
  - 核查现有竞争、替代、进入者、供应方和买方关系的实际范围
  - 逐项说明证据和作用机制，不用模型直觉给高低分
  - 未知力量保留缺口，不因候选数量少认定竞争弱
